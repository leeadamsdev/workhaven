services:
  frontend:
    build:
      context: .
      dockerfile: src/frontend/Dockerfile
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "--timeout=3", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: src/backend/Workhaven.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Database__Host: postgres
      Database__Name: workhaven
      Database__Username: workhaven_app
      Database__Password: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in .env}
      Mailpit__BaseUrl: http://mailpit:8025
      ConfirmationEmail__PageUrl: http://localhost:${FRONTEND_PORT:-5173}/confirm-email
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    volumes:
      - api_keys:/home/app/.aspnet/DataProtection-Keys
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "8", "http://localhost:8080/health/ready"]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 10s

  migrations:
    build:
      context: .
      dockerfile: src/backend/Workhaven.Api/Dockerfile
      target: migrations
    environment:
      PGHOST: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: workhaven
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.31.1
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_DB: workhaven
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./development/postgres/init-app-user.sh:/docker-entrypoint-initdb.d/10-workhaven-app.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  api_keys:
  postgres_data:
